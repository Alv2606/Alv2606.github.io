<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Panadería La Alhambra</title>
  
  <defs>
    <!-- Gradientes para profundidad -->
    <linearGradient id="torreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c85e33"/>
      <stop offset="100%" style="stop-color:#b14f2c"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff6f0"/>
      <stop offset="100%" style="stop-color:#fff1e6"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo del logo con gradiente suave -->
  <rect width="80" height="80" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Arcos y torres de la Alhambra, centrado y con más detalle -->
  <g transform="translate(12,10)">
    <!-- Torre central -->
    <path d="M28 6 L28 38 L44 38 L44 6 L36 2 Z" fill="url(#torreGradient)"/>
    
    <!-- Arcos laterales -->
    <path d="M4 18 Q12 10 20 18 L20 38 L4 38 Z" fill="url(#torreGradient)"/>
    <path d="M52 18 Q60 10 68 18 L68 38 L52 38 Z" fill="url(#torreGradient)"/>
    
    <!-- Detalles arabescos -->
    <path d="M30 10 Q36 6 42 10 Q36 14 30 10" fill="#fff" opacity="0.9"/>
    <path d="M8 22 Q12 18 16 22 Q12 26 8 22" fill="#fff" opacity="0.9"/>
    <path d="M56 22 Q60 18 64 22 Q60 26 56 22" fill="#fff" opacity="0.9"/>
    
    <!-- Detalles adicionales -->
    <path d="M32 14 L34 14 L34 18 L32 18 Z" fill="#fff" opacity="0.8"/>
    <path d="M38 14 L40 14 L40 18 L38 18 Z" fill="#fff" opacity="0.8"/>
    
    <!-- Base ornamental -->
    <rect x="0" y="38" width="72" height="8" rx="2" fill="url(#torreGradient)"/>
    
    <!-- Detalles ornamentales mejorados -->
    <path d="M2 40 C18 36 36 36 70 40" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.9"/>
    <path d="M24 40 C36 38 48 38 58 40" fill="none" stroke="#fff" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Decoración superior mejorada -->
  <path d="M24 8 L40 3 L56 8" fill="none" stroke="#b14f2c" stroke-width="2.5" opacity="0.8"/>
</svg>